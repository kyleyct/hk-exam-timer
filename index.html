<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校園考試計時器</title>
  <meta name="description" content="為香港教師設計的考試計時器：剩餘時間、考試時段、科目、卷別、公告，純前端、可離線使用。" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- 設定畫面 -->
  <section id="setup" class="screen setup">
    <div class="container">
      <header class="setup-header">
        <div>
          <h1 data-i18n="app.title">校園考試計時器</h1>
          <p class="subtitle" data-i18n="app.subtitle">為香港教師而設 · 純前端 · 可離線使用</p>
        </div>
        <div class="lang-switcher">
          <label data-i18n="label.language">語言</label>
          <select id="lang-select">
            <option value="zh-HK">繁體中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </header>

      <div class="card">
        <h2 data-i18n="label.subject">科目</h2>
        <div class="row split">
          <div>
            <label data-i18n="label.subject">科目</label>
            <!-- Combobox: search + free input (vanilla JS) -->
            <div class="combobox" data-name="subject">
              <input type="text" id="subject" class="combobox-input"
                     autocomplete="off" spellcheck="false"
                     data-i18n-placeholder="placeholder.subject"
                     placeholder="輸入或選擇科目" />
              <ul class="combobox-list" id="subject-list" hidden></ul>
            </div>
          </div>
          <div>
            <label data-i18n="label.paper">卷別</label>
            <div class="combobox" data-name="paper">
              <input type="text" id="paper" class="combobox-input"
                     autocomplete="off" spellcheck="false"
                     data-i18n-placeholder="placeholder.paper"
                     placeholder="例：卷一 / Paper 1 / MC" />
              <ul class="combobox-list" id="paper-list" hidden></ul>
            </div>
          </div>
        </div>

        <h2 data-i18n="label.start_time">開考時間</h2>
        <div class="row split">
          <label data-i18n="label.start_time">開考時間
            <input id="start-time" type="time" step="60"
                   data-i18n-placeholder="placeholder.start_time" placeholder="09:00" />
          </label>
          <label data-i18n="label.end_time">完卷時間
            <input id="end-time" type="time" step="60"
                   data-i18n-placeholder="placeholder.end_time" placeholder="10:30" />
          </label>
          <label data-i18n="label.duration">考試時長 (分鐘)
            <input id="duration" type="number" min="1" max="600"
                   data-i18n-placeholder="placeholder.duration" placeholder="60" />
          </label>
        </div>

        <h2 data-i18n="label.notice">公告 / 試場提示</h2>
        <div class="row">
          <label data-i18n="label.notice">公告 / 試場提示
            <textarea id="notice" rows="3"
                      data-i18n-placeholder="placeholder.notice"
                      placeholder="例：第三題 B 選項改為 C；第五題刪除"></textarea>
          </label>
        </div>

        <div class="row">
          <label data-i18n="label.notice_size">公告字體大小
            <input id="notice-size" type="range" min="16" max="120" value="36" />
            <span id="notice-size-val" class="hint">36px</span>
          </label>
        </div>

        <div class="row buttons">
          <button id="test-alarm-btn" class="btn-secondary" data-i18n="button.test_alarm">🔊 試響</button>
          <button id="fullscreen-btn" class="btn-secondary" data-i18n="button.fullscreen">全螢幕</button>
          <button id="start-btn" class="btn-primary" data-i18n="button.start">開始考試</button>
        </div>

        <details class="hint-block">
          <summary data-i18n="hint.usage_title">使用提示</summary>
          <ul data-i18n-list="hint.usage_lines"></ul>
        </details>
      </div>

      <p class="footer" data-i18n="footer.tagline">8 週 AI × 教育 · W2 工具</p>
    </div>
  </section>

  <!-- 考試中畫面 (重構: 採用 fold windows 模式將喺階段 2 引入) -->
  <section id="live" class="screen live hidden">
    <header class="live-header">
      <div class="live-meta">
        <span id="live-slot" class="time-slot">— : — — : —</span>
        <span id="live-status" class="status" data-i18n="live.running">考試中</span>
      </div>
      <div class="live-subject-display">
        <span class="subject-label" data-i18n="label.subject">科目</span>
        <span id="live-subject" class="subject-name">—</span>
        <span class="subject-sep" id="live-paper-sep" hidden>·</span>
        <span id="live-paper" class="subject-name" hidden></span>
      </div>
    </header>

    <main class="live-main">
      <!-- 大倒數 -->
      <div id="big-time" class="big-time">--:--:--</div>
      <div id="big-time-label" class="big-time-label" data-i18n="live.remaining">剩餘時間</div>

      <!-- 公告: 考試中可繼續編輯 (contenteditable) -->
      <div id="live-notice-wrap" class="live-notice-wrap">
        <div id="live-notice" class="live-notice" contenteditable="true"
             data-i18n-placeholder="placeholder.notice"
             placeholder="公告（可即時編輯）"></div>
      </div>
    </main>

    <footer class="live-footer">
      <button id="pause-btn" class="btn-secondary" data-i18n="button.pause">暫停</button>
      <button id="end-btn" class="btn-danger" data-i18n="button.end">結束考試</button>
    </footer>
  </section>

  <!-- 響鬧畫面: 改用綠色 (階段 1 sub-task 2) -->
  <section id="alarm" class="screen alarm hidden" role="alertdialog" aria-live="assertive">
    <div class="alarm-content">
      <div class="alarm-icon">⏰</div>
      <div class="alarm-title" data-i18n="alarm.title">完卷</div>
      <div id="alarm-subject" class="alarm-subject">—</div>
      <div id="alarm-paper" class="alarm-paper" hidden></div>
      <div class="alarm-hint" data-i18n="alarm.hint">按「結束考試」停止響鬧</div>
    </div>
  </section>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/combobox.js"></script>
  <script src="scripts/timer.js"></script>
</body>
</html>
