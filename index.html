<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>科目 / 年級</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --paper: #f7fbfb;
    --ink: #121417;
    --teal: #0d9488;
    --teal-deep: #0f766e;
    --accent: #ff2d7b;
    --amber: #f59e0b;
    --red: #dc2626;
    --muted: #5c6766;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Noto Sans CJK TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", "Noto Sans TC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  .stage {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    padding: 5vh 4vw 56px 56px;
  }

  body:not(.projector-mode) .stage {
    padding-right: min(400px, 34vw);
  }

  .topbar {
    position: relative;
    z-index: 2;
    width: min(920px, 100%);
    text-align: center;
  }

  .subject-input {
    width: 100%;
    text-align: center;
    font: inherit;
    font-size: clamp(32px, 4.4vw, 64px);
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 4px solid transparent;
    border-radius: 0;
    padding: 0.15em 0.2em 0.2em;
  }
  .subject-input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .subject-input::placeholder {
    color: #8b9493;
    font-weight: 800;
  }

  .clock-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4vh;
    margin-top: 0;
    background: #ffffff;
    border: 5px solid var(--teal);
    border-radius: 28px;
    padding: 3vh 4vw 2.6vh;
    box-shadow: 0 10px 0 var(--teal);
    min-width: min(56vw, 820px);
  }

  .clock {
    font-size: clamp(108px, 16vw, 280px);
    font-weight: 900;
    line-height: 0.9;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }

  .clock.warn { color: var(--amber); }
  .clock.danger {
    color: var(--red);
    animation: pulse 1s ease-in-out infinite;
  }
  .clock.done {
    color: var(--red);
    animation: flash 0.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .period {
    font-size: clamp(20px, 2.6vw, 40px);
    font-weight: 800;
    color: var(--teal);
    letter-spacing: 0.06em;
  }

  .screen-tag {
    position: fixed;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 6;
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.22em;
    writing-mode: vertical-rl;
    color: var(--accent);
  }

  .status-pill {
    position: absolute;
    top: 2vh;
    left: 56px;
    z-index: 5;
    padding: 0.55vh 1.2vw;
    border-radius: 999px;
    background: #ffffff;
    color: var(--ink);
    border: 2px solid var(--teal);
    font-size: clamp(12px, 1.2vw, 18px);
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .status-pill.live {
    background: var(--teal);
    color: #ffffff;
    border-color: var(--teal);
  }
  .status-pill.paused {
    background: #ffffff;
    color: var(--ink);
    border-color: var(--accent);
  }
  .status-pill.done {
    background: var(--red);
    color: #ffffff;
    border-color: var(--red);
  }
  .status-pill.idle {
    background: #ffffff;
    color: var(--ink);
    border-color: var(--teal);
  }

  .info-bar {
    position: relative;
    z-index: 2;
    width: min(920px, 100%);
    text-align: center;
    padding: 1.2vh 2vw;
    background: #ffffff;
    color: var(--ink);
    border: 3px solid var(--teal);
    border-radius: 14px;
    font-size: clamp(18px, 2.2vw, 34px);
    font-weight: 700;
    letter-spacing: 0.04em;
    min-height: 5vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .info-bar.editing {
    border-color: var(--accent);
    outline: 3px dashed var(--accent);
    outline-offset: -8px;
  }

  .info-input {
    background: transparent;
    border: none;
    color: var(--ink);
    text-align: center;
    width: 100%;
    font: inherit;
    outline: none;
  }
  .info-input::placeholder { color: #8b9493; }

  .panel {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    width: 340px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    background: #ffffff;
    color: var(--ink);
    border: 3px solid var(--teal);
    border-radius: 16px;
    padding: 14px 14px 12px;
    box-shadow: 6px 6px 0 var(--accent);
    transition: transform 0.3s, opacity 0.3s;
  }
  .panel.collapsed {
    transform: translateX(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .panel .sub {
    font-size: 13px;
    font-weight: 800;
    color: var(--teal-deep);
    margin: 0;
  }
  .lang-btn {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: #ffffff;
    color: var(--accent);
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .lang-btn:hover { background: #fff0f6; }

  .panel-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 101;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--teal);
    cursor: pointer;
    font-size: 20px;
    color: var(--teal);
    display: none;
  }
  .panel-toggle.visible { display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: var(--teal-deep);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .field input[type="time"],
  .field input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid var(--teal);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #ffffff;
  }
  .field input[type="file"] {
    font-size: 12px;
    width: 100%;
    color: var(--ink);
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .btn {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--teal);
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.03em;
    background: #ffffff;
    color: var(--ink);
  }
  .btn:hover { filter: brightness(0.98); }
  .btn-primary {
    background: var(--teal);
    color: #ffffff;
    border-color: var(--teal);
  }
  .btn-primary:hover { background: var(--teal-deep); border-color: var(--teal-deep); }
  .btn-secondary {
    background: #ffffff;
    color: var(--ink);
    border-color: var(--teal);
  }
  .btn-ghost {
    background: #ffffff;
    color: var(--teal-deep);
    border-color: var(--teal);
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }

  .hint {
    font-size: 11px;
    color: var(--ink);
    line-height: 1.5;
    background: #e7f7f5;
    border-left: 4px solid var(--teal);
    padding: 8px 10px;
    border-radius: 4px;
    margin-top: 10px;
  }

  .divider {
    height: 2px;
    background: #d5eeeb;
    margin: 12px 0;
  }

  .kbd {
    background: #ffffff;
    border: 2px solid var(--teal);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: monospace;
    color: var(--ink);
  }

  body.projector-mode .panel,
  body.projector-mode .panel-toggle { display: none; }
  body.projector-mode .status-pill { display: none; }

  .page-foot {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 140;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 6px 12px 8px;
    background: var(--paper);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.3;
  }
  .page-foot a {
    color: var(--teal-deep);
    font-weight: 800;
  }
  body.projector-mode .page-foot { display: flex; }

  .alert {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--red);
    color: #ffffff;
    padding: 4vh 6vw;
    border-radius: 24px;
    font-size: clamp(40px, 6vw, 96px);
    font-weight: 900;
    z-index: 200;
    box-shadow: 0 16px 0 #7f1d1d;
    display: none;
    text-align: center;
    letter-spacing: 0.08em;
  }
  .alert.visible { display: block; }

  body.projector-mode .panel-toggle.visible { display: flex; }

  /* Phone and tablet: stack controls under the clock. Desktop (1366) stays side-by-side. */
  @media (max-width: 1024px) {
    html, body {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .stage {
      position: relative;
      inset: auto;
      min-height: 0;
      justify-content: flex-start;
      gap: 14px;
      padding: 16px 16px 8px;
    }
    body:not(.projector-mode) .stage { padding-right: 16px; }

    .status-pill {
      position: static;
      align-self: center;
    }

    .topbar { width: 100%; }

    .subject-input {
      font-size: clamp(28px, 8vw, 48px);
      min-height: 44px;
      padding: 8px 4px;
    }

    .screen-tag {
      position: static;
      transform: none;
      writing-mode: horizontal-tb;
      letter-spacing: 0.14em;
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
      width: 100%;
    }

    .clock-wrap {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      border-width: 4px;
      border-radius: 20px;
      padding: 14px 10px 12px;
      box-shadow: 0 6px 0 var(--teal);
    }

    .clock {
      font-size: clamp(88px, 27vw, 210px);
      max-width: 100%;
    }

    .period { font-size: clamp(18px, 5vw, 32px); }

    .info-bar {
      width: 100%;
      font-size: clamp(16px, 4.2vw, 22px);
      padding: 10px 12px;
    }

    .panel {
      position: static;
      width: auto;
      max-height: none;
      overflow: visible;
      margin: 8px 16px 16px;
      box-shadow: 4px 4px 0 var(--accent);
    }

    .page-foot {
      position: static;
      width: 100%;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }

    .btn,
    .lang-btn,
    .field input[type="time"],
    .field input[type="text"] {
      min-height: 44px;
    }

    body.projector-mode {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body.projector-mode .stage {
      position: fixed;
      inset: 0;
      height: 100%;
      justify-content: center;
      gap: 2vh;
      padding: 64px 16px 56px;
    }
    body.projector-mode .panel { display: none; }
    body.projector-mode .clock {
      font-size: min(28vw, 36vh, 260px);
    }
    body.projector-mode .page-foot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      display: flex;
    }
    body.projector-mode .panel-toggle.visible {
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="status-pill idle" id="statusPill">未開始</div>

  <div class="topbar">
    <input
      class="subject-input"
      id="subjectInput"
      type="text"
      placeholder="科目 / 年級"
      aria-label="科目 / 年級"
      autocomplete="off"
    />
  </div>
  <div class="screen-tag" id="screenTag">計時器</div>

  <div class="clock-wrap">
    <div class="clock" id="clock">60:00</div>
    <div class="period" id="period">09:00 — 10:00</div>
  </div>

  <div class="info-bar" id="infoBar">
    <input
      class="info-input"
      id="infoInput"
      type="text"
      placeholder="試場備註（按 Enter 確認，雙擊可再改）"
      autocomplete="off"
    />
  </div>
</div>

<div class="alert" id="alertBox">時間到！</div>

<button class="panel-toggle" id="panelToggle" title="開啟控制台">⚙</button>

<div class="panel" id="panel">
  <div class="panel-head">
    <div class="sub" id="panelSub">試場投影</div>
    <button class="lang-btn" id="btnLang" type="button">English</button>
  </div>

  <div class="field">
    <label id="labelBg">背景圖片</label>
    <input type="file" id="bgInput" accept="image/*" />
    <div class="hint" id="hintBg">預設純色背景。如要更換，揀新圖覆蓋即可（只喺瀏覽器內顯示，唔會上傳）。</div>
  </div>

  <div class="row">
    <div class="field">
      <label id="labelStart">開始時間</label>
      <input type="time" id="startTime" value="09:00" />
    </div>
    <div class="field">
      <label id="labelEnd">結束時間</label>
      <input type="time" id="endTime" value="10:00" />
    </div>
  </div>

  <div class="field">
    <label id="labelWarn">提示時間（秒）</label>
    <input type="text" id="warnSeconds" value="60, 30, 10" />
    <div class="hint" id="hintWarn">用逗號分隔，例如 60, 30, 10 會喺最後 60／30／10 秒響提示。</div>
  </div>

  <div class="divider"></div>

  <div class="btn-group">
    <button class="btn btn-primary" id="btnStart" type="button">▶ 開始</button>
    <button class="btn btn-secondary" id="btnPause" type="button">⏸ 暫停</button>
    <button class="btn btn-secondary" id="btnResume" type="button">↻ 繼續</button>
    <button class="btn btn-ghost" id="btnReset" type="button">⟲ 重設</button>
  </div>

  <div class="divider"></div>

  <div class="btn-group">
    <button class="btn btn-ghost" id="btnFullscreen" type="button">⛶ 投影模式</button>
    <button class="btn btn-ghost" id="btnTestAlert" type="button">🔔 試響鬧</button>
  </div>

  <div class="hint" id="hintKeys">
    <strong>快捷鍵：</strong><br>
    <span class="kbd">Space</span> 開始 / 暫停 ·
    <span class="kbd">R</span> 重設 ·
    <span class="kbd">F</span> 全螢幕 ·
    <span class="kbd">Esc</span> 退出全螢幕
  </div>

  <div class="hint" id="hintLogic">
    <strong>倒數邏輯：</strong>對齊完卷牆鐘。剩餘時間 = 結束時間 − 而家。遲啲先撳開始，就會少咗時間，唔會再跑足成段時長。
  </div>
</div>

<footer class="page-foot" id="pageFoot">
  <a id="repoLink" href="https://github.com/kyleyct/hk-exam-timer">github.com/kyleyct/hk-exam-timer</a>
  <span id="credit">創作者：Kyle Yeung</span>
</footer>

  var startInput = document.getElementById('startTime');
  var endInput = document.getElementById('endTime');

  var btnPause = document.getElementById('btnPause');
  var btnResume = document.getElementById('btnResume');

  var btnTestAlert = document.getElementById('btnTestAlert');
  var btnLang = document.getElementById('btnLang');

  var state = {
    lang: 'zh-HK',
    bgUrl: '',
    running: false,
    paused: false,

    endWall: null,

    firedAlerts: new Set(),
    warnSeconds: [60, 30, 10],
    prevSec: null,
    alertKind: null
  };

  var tickGen = 0;
  var audioCtx = null;

  function t() { return STR[state.lang]; }

  function applyLang(lang) {
    if (!STR[lang]) lang = 'zh-HK';
    state.lang = lang;
    var s = STR[lang];
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-HK';
    subjectInput.placeholder = s.subjectPh;
    subjectInput.setAttribute('aria-label', s.subjectPh);
    screenTag.textContent = s.screenTag;
    creditEl.textContent = s.credit;
    document.title = subjectInput.value.trim() || s.subjectPh;
    document.getElementById('panelSub').textContent = s.sub;
    document.getElementById('labelBg').textContent = s.bg;
    document.getElementById('hintBg').textContent = s.bgHint;
    document.getElementById('labelStart').textContent = s.start;
    document.getElementById('labelEnd').textContent = s.end;
    document.getElementById('labelWarn').textContent = s.warn;
    document.getElementById('hintWarn').textContent = s.warnHint;
    btnStart.textContent = s.btnStart;
    btnPause.textContent = s.btnPause;
    btnResume.textContent = s.btnResume;
    btnReset.textContent = s.btnReset;
    btnFullscreen.textContent = s.btnFull;
    btnTestAlert.textContent = s.btnTest;
    document.getElementById('hintKeys').innerHTML = s.keysHtml;
    document.getElementById('hintLogic').innerHTML = s.logicHtml;
    infoInput.placeholder = s.infoPh;
    btnLang.textContent = s.langBtn;
    panelToggle.title = s.panelToggle;
    refreshStatus();
    if (alertBox.classList.contains('visible') && state.alertKind) {
      alertBox.textContent = state.alertKind === 'test' ? s.testAlert : s.timeUp;
    }
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  }

  function loadLang() {
    try {
      var v = localStorage.getItem(LANG_KEY);
      if (v === 'en' || v === 'zh-HK') return v;
    } catch (e) {}
    return 'zh-HK';
  }

  bgInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (state.bgUrl) URL.revokeObjectURL(state.bgUrl);
    state.bgUrl = URL.createObjectURL(file);
    stage.style.backgroundImage = 'url(' + state.bgUrl + ')';
    stage.style.backgroundSize = 'cover';
  });

  subjectInput.addEventListener('input', function () {
    document.title = subjectInput.value.trim() || t().subjectPh;
  });

  function commitInfo() { infoBar.classList.remove('editing'); }
  infoInput.addEventListener('focus', function () { infoBar.classList.add('editing'); });
  infoInput.addEventListener('blur', commitInfo);
  infoInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); infoInput.blur(); }
  });
  infoBar.addEventListener('dblclick', function () { infoInput.focus(); });

  function parseTimeToToday(hhmm) {
    if (!hhmm) return null;
    var parts = hhmm.split(':');
    var h = Number(parts[0]);
    var m = Number(parts[1]);
    if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
    var d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  function formatHHMM(d) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function formatRemaining(ms) {
    if (ms < 0) ms = 0;
    var total = Math.ceil(ms / 1000);
    var m = Math.floor(total / 60);
    var s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function getAudioCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    return audioCtx;
  }

  function beep(freq, dur) {
    try {
      var ctx = getAudioCtx();
      if (!ctx) return;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      var t0 = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  function playAlertSequence() {
    beep(660, 0.2);
    setTimeout(function () { beep(880, 0.2); }, 250);
    setTimeout(function () { beep(1100, 0.4); }, 500);
  }

  function showAlert(kind) {
    state.alertKind = kind;
    alertBox.textContent = kind === 'test' ? t().testAlert : t().timeUp;
    alertBox.classList.add('visible');
  }
  function hideAlert() {
    state.alertKind = null;
    alertBox.classList.remove('visible');
  }

  function computeSchedule() {
    var start = parseTimeToToday(startInput.value);
    var end = parseTimeToToday(endInput.value);
    if (!start || !end) return false;
    if (end.getTime() <= start.getTime()) end.setDate(end.getDate() + 1);
    state.startWall = start.getTime();
    state.endWall = end.getTime();
    state.totalDuration = state.endWall - state.startWall;
    return state.totalDuration > 0;
  }

  function refreshStatus() {
    var s = t();
    var kind = 'idle';
    var text = s.statusIdle;
    if (state.firedAlerts.has('done')) {
      kind = 'done';
      text = s.statusDone;
    } else if (state.running && state.paused) {
      kind = 'paused';
      text = s.statusPaused;
    } else if (state.running) {
      kind = 'live';
      text = s.statusLive;
    }
    statusPill.className = 'status-pill ' + kind;
    statusPill.textContent = text;
  }

  function parseWarnings() {
    var list = warnInput.value.split(',').map(function (part) {
      return parseInt(part.trim(), 10);
    }).filter(function (n) { return Number.isFinite(n) && n > 0; });
    state.warnSeconds = list.length ? list : [60, 30, 10];
  }

  function updatePeriod() {
    if (!state.startWall || !state.endWall) {
      periodEl.textContent = '--:-- — --:--';
      return;
    }
    periodEl.textContent = formatHHMM(new Date(state.startWall)) + ' — ' + formatHHMM(new Date(state.endWall));
  }

  function showIdlePreview() {
    if (state.running) return;
    if (!computeSchedule()) return;
    clockEl.textContent = formatRemaining(state.totalDuration);
    clockEl.className = 'clock';
    updatePeriod();
  }

  function fireWarning(w) {
    if (state.firedAlerts.has('w' + w) || state.firedAlerts.has(w)) return;
    state.firedAlerts.add(w);
    beep(1200, 0.12);
    if (navigator.vibrate) {
      try { navigator.vibrate(150); } catch (e) {}
    }
  }

  function checkWarnings(remaining) {
    var sec = Math.ceil(Math.max(0, remaining) / 1000);
    var prev = state.prevSec;
    if (prev == null) {
      state.prevSec = sec;
      if (sec > 0) {
        state.warnSeconds.forEach(function (w) {
          if (w === sec) fireWarning(w);
        });
      }
      return;
    }
    state.warnSeconds.forEach(function (w) {
      if (prev > w && sec <= w) fireWarning(w);
    });
    state.prevSec = sec;
  }

  function render(remaining) {
    clockEl.textContent = formatRemaining(remaining);
    checkWarnings(remaining);
    clockEl.classList.remove('warn', 'danger', 'done');
    if (remaining <= 0) {
      clockEl.classList.add('done');
      if (!state.firedAlerts.has('done')) {
        state.firedAlerts.add('done');
        refreshStatus();
        showAlert('timeup');
        playAlertSequence();
        if (navigator.vibrate) {
          try { navigator.vibrate([400, 200, 400, 200, 600]); } catch (e) {}
        }
      }
      return false;
    }
    if (remaining <= 10000) clockEl.classList.add('danger');
    else if (remaining <= 60000) clockEl.classList.add('warn');
    return true;
  }

  function schedule(gen) {
    setTimeout(function () {
      if (gen !== tickGen) return;
      tick();
    }, 100);
  }

  function tick() {
    if (!state.running || state.paused) return;
    var gen = tickGen;
    var remaining = state.paused && state.pausedAt
      ? state.endWall - state.pausedAt
      : state.endWall - Date.now();
    var keep = render(remaining);
    if (!keep) return;
    if (gen !== tickGen || !state.running || state.paused) return;
    schedule(gen);
  }

  function start() {
    parseWarnings();
    if (!computeSchedule()) {
      window.alert(t().badTime);
      return;
    }
    tickGen++;
    state.running = true;
    state.paused = false;
    state.pausedAt = null;
    state.firedAlerts = new Set();
    state.prevSec = null;
    updatePeriod();
    hideAlert();
    refreshStatus();
    tick();
  }

  function pause() {
    if (!state.running || state.paused) return;
    state.paused = true;
    state.pausedAt = Date.now();
    tickGen++;
    refreshStatus();
    clockEl.textContent = formatRemaining(state.endWall - state.pausedAt);
  }

  function resume() {
    if (!state.running || !state.paused) return;
    state.paused = false;
    state.pausedAt = null;
    tickGen++;
    refreshStatus();
    tick();
  }

  function reset() {
    tickGen++;
    state.running = false;
    state.paused = false;
    state.pausedAt = null;
    state.firedAlerts = new Set();
    state.prevSec = null;
    clockEl.className = 'clock';
    hideAlert();
    refreshStatus();
    showIdlePreview();
  }

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
  btnResume.addEventListener('click', resume);
  btnReset.addEventListener('click', reset);

  function toggleProjector() {
    document.body.classList.toggle('projector-mode');
    if (document.body.classList.contains('projector-mode')) {
      panel.classList.add('collapsed');
      panelToggle.classList.add('visible');
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    } else {
      panel.classList.remove('collapsed');
      panelToggle.classList.remove('visible');
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(function () {});
      }
    }
  }
  btnFullscreen.addEventListener('click', toggleProjector);
  panelToggle.addEventListener('click', toggleProjector);

  btnTestAlert.addEventListener('click', function () {
    showAlert('test');
    playAlertSequence();
    setTimeout(function () {
      if (state.alertKind === 'test') hideAlert();
    }, 1500);
  });

  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) {
      document.body.classList.remove('projector-mode');
      panel.classList.remove('collapsed');
      panelToggle.classList.remove('visible');
    }
  });

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state.running && !state.paused) pause();
      else if (state.running && state.paused) resume();
      else start();
    } else if (e.key === 'r' || e.key === 'R') {
      reset();
    } else if (e.key === 'f' || e.key === 'F') {
      toggleProjector();
    }
  });

  btnLang.addEventListener('click', function () {
    applyLang(state.lang === 'en' ? 'zh-HK' : 'en');
  });

  warnInput.addEventListener('change', parseWarnings);
  startInput.addEventListener('change', showIdlePreview);
  endInput.addEventListener('change', showIdlePreview);

  window.addEventListener('beforeunload', function (e) {
    if (state.running && !state.paused && !state.firedAlerts.has('done')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  applyLang(loadLang());
  parseWarnings();
  reset();
})();
</script>
</body>
</html>
